<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交不出成果，先分清楚卡在哪裡</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&amp;family=Noto+Sans+TC:wght@300;400;500&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#F5F2ED;color:#0A1628;font-family:'Outfit','Noto Sans TC',sans-serif}main{max-width:960px;margin:0 auto}svg{display:block;width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" role="img" aria-labelledby="work-overload-title work-overload-desc"><title id="work-overload-title">交不出成果，先分清楚卡在哪裡</title><desc id="work-overload-desc">工作交不出成果時，分別檢查工作量、切換與決策權，再考慮調整承諾、先完成一件工作或明說插單代價；原因仍待確認。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#162544"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7A6A3A"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#162544"/></marker></defs><rect width="960" height="584" fill="#F5F2ED"/><g font-family="'Outfit', 'Noto Sans TC', sans-serif" fill="#0A1628"><text x="40" y="40" font-size="12" font-weight="400" letter-spacing="2" fill="#7A6A3A">MODEL THINKING</text><text x="40" y="84" font-size="28" font-weight="300">交不出成果，先分清楚卡在哪裡</text><path data-edge="true" d="M 408 200 V 208 A 8 8 0 0 1 400 216 H 168 A 8 8 0 0 0 160 224 V 256" fill="none" stroke="#162544" marker-end="url(#arrow)"/><line data-edge="true" x1="480" y1="200" x2="480" y2="256" stroke="#162544" marker-end="url(#arrow)"/><path data-edge="true" d="M 552 200 V 208 A 8 8 0 0 0 560 216 H 792 A 8 8 0 0 1 800 224 V 256" fill="none" stroke="#162544" marker-end="url(#arrow)"/><line data-edge="true" x1="160" y1="344" x2="160" y2="392" stroke="#162544" marker-end="url(#arrow)"/><line data-edge="true" x1="480" y1="344" x2="480" y2="392" stroke="#162544" marker-end="url(#arrow)"/><line data-edge="true" x1="800" y1="344" x2="800" y2="392" stroke="#162544" marker-end="url(#arrow)"/><g data-node="true"><rect x="360" y="120" width="240" height="80" fill="#F5EFE6" stroke="#7A6A3A" stroke-width="1"/><text x="480" y="156" text-anchor="middle" font-size="16" font-weight="500">每件都在做，</text><text x="480" y="180" text-anchor="middle" font-size="16" font-weight="500">卻交不出成果</text></g><g data-node="true"><rect x="40" y="256" width="240" height="88" fill="#F5F2ED" stroke="#0A1628" stroke-width="1"/><text x="160" y="296" text-anchor="middle" font-size="16" font-weight="500">工作量：進來的</text><text x="160" y="320" text-anchor="middle" font-size="16" font-weight="500">是否比完成的多？</text></g><g data-node="true"><rect x="40" y="392" width="240" height="88" fill="#F5F2ED" stroke="#0A1628" stroke-width="1"/><text x="160" y="432" text-anchor="middle" font-size="16" font-weight="500">必要時調整範圍、</text><text x="160" y="456" text-anchor="middle" font-size="16" font-weight="500">期限或資源</text></g><g data-node="true"><rect x="360" y="256" width="240" height="88" fill="#F5F2ED" stroke="#0A1628" stroke-width="1"/><text x="480" y="296" text-anchor="middle" font-size="16" font-weight="500">切換：多少工作</text><text x="480" y="320" text-anchor="middle" font-size="16" font-weight="500">停在半途？</text></g><g data-node="true"><rect x="360" y="392" width="240" height="88" fill="#F5F2ED" stroke="#0A1628" stroke-width="1"/><text x="480" y="432" text-anchor="middle" font-size="16" font-weight="500">先試著完成</text><text x="480" y="456" text-anchor="middle" font-size="16" font-weight="500">一件主線工作</text></g><g data-node="true"><rect x="680" y="256" width="240" height="88" fill="#F5F2ED" stroke="#0A1628" stroke-width="1"/><text x="800" y="296" text-anchor="middle" font-size="16" font-weight="500">決策權：誰決定</text><text x="800" y="320" text-anchor="middle" font-size="16" font-weight="500">插單的先後？</text></g><g data-node="true"><rect x="680" y="392" width="240" height="88" fill="#F5F2ED" stroke="#0A1628" stroke-width="1"/><text x="800" y="432" text-anchor="middle" font-size="16" font-weight="500">明說插單會讓</text><text x="800" y="456" text-anchor="middle" font-size="16" font-weight="500">哪件事延後</text></g><line x1="40" y1="520" x2="920" y2="520" stroke="rgba(201,169,110,0.4)"/><text x="40" y="544" font-size="12" fill="#162544">這些是待確認的原因；連線表示檢查方向，不代表因果已被證明。</text></g></svg></main></body></html>
